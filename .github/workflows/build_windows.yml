name: Build Windows

# Produces MuSicX Desktop .msi / .exe installers via Compose Desktop,
# mirroring how Android APKs are built and uploaded as Actions artifacts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/build_windows.yml"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows Installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Package Windows MSI + EXE
        shell: bash
        run: ./gradlew --console=plain :desktop:packageReleaseMsi :desktop:packageReleaseExe --warning-mode summary

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find desktop/build/compose/binaries -type f \( -name '*.msi' -o -name '*.exe' \) -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "out/$(basename "$f")"
              done
          echo "Packaged files:"
          ls -la out/ || true
          if [ -z "$(ls -A out 2>/dev/null || true)" ]; then
            echo "::error::No .msi/.exe artifacts found under desktop/build/compose/binaries"
            find desktop/build -type f | head -100 || true
            exit 1
          fi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v6
        with:
          name: MuSicX-Windows
          path: out/*
          if-no-files-found: error
