name: Build Windows

# Produces MuSicX Desktop .exe via Compose Desktop on each desktop slice.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-desktop
    paths:
      - "desktop/**"
      - ".github/workflows/build_windows.yml"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/build_windows.yml"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows Installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Package Windows EXE (bundles LibVLC via vlc-setup)
        shell: bash
        # vlc-setup tasks call Task.project at execution time; incompatible with configuration cache.
        run: ./gradlew --console=plain --no-configuration-cache :desktop:vlcSetup :desktop:packageReleaseExe --warning-mode summary

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find desktop/build/compose/binaries -type f -name '*.exe' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "out/$(basename "$f")"
              done
          echo "Packaged files:"
          ls -la out/ || true
          if [ -z "$(ls -A out 2>/dev/null || true)" ]; then
            echo "::error::No .exe artifact found under desktop/build/compose/binaries"
            find desktop/build -type f | head -100 || true
            exit 1
          fi

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: MuSicX-Windows
          path: out/*
          if-no-files-found: error
