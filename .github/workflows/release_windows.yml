name: Release Windows Installer

# Builds the MuSicX Desktop Windows installer (.exe) and attaches it to the
# GitHub release whenever a release is published. The APK release is created by
# release.yml using RELEASE_TOKEN (a PAT), so the `release: published` event
# below fires normally and this job uploads the Windows installer as an asset.
on:
  release:
    types: [published]
  # Allows re-attaching the installer to an existing release by tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Windows installer to (e.g. v13.14.2)"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build_windows_release:
    name: Build & attach Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag"
            exit 1
          fi
          # Accept either the exact tag ("v13.15") or just the version ("13.15"):
          # pick whichever tag actually exists so a manual dispatch typo still works.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$TAG" >/dev/null 2>&1; then
              echo "Tag '$TAG' not found; using 'v$TAG' instead."
              TAG="v$TAG"
            else
              echo "::error::No tag '$TAG' or 'v$TAG' exists in $GITHUB_REPOSITORY"
              exit 1
            fi
          fi
          # Strip leading v and keep only the numeric MAJOR[.MINOR[.PATCH]] part,
          # which is what jpackage accepts as a Windows package version.
          VERSION="${TAG#v}"
          VERSION="$(printf '%s' "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          if [ -z "$VERSION" ]; then
            echo "::warning::Tag '$TAG' has no numeric version; falling back to baseline"
            VERSION="13.14.2"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG -> installer version: $VERSION"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Package Windows installer (bundles LibVLC via vlc-setup)
        shell: bash
        # vlc-setup tasks call Task.project at execution time; incompatible with configuration cache.
        run: >-
          ./gradlew --console=plain --no-configuration-cache
          -PdesktopPackageVersion=${{ steps.tag.outputs.version }}
          :desktop:vlcSetup :desktop:packageReleaseExe --warning-mode summary

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find desktop/build/compose/binaries -type f -name '*.exe' -print0 \
            | while IFS= read -r -d '' f; do
                cp "$f" "out/$(basename "$f")"
              done
          echo "Packaged files:"
          ls -la out/ || true
          if [ -z "$(ls -A out 2>/dev/null || true)" ]; then
            echo "::error::No .exe artifact found under desktop/build/compose/binaries"
            find desktop/build -type f | head -100 || true
            exit 1
          fi

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Attaching Windows installer(s) to release ${{ steps.tag.outputs.tag }}"
          gh release upload "${{ steps.tag.outputs.tag }}" out/*.exe --clobber
          echo "Windows installer attached successfully."

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Windows Installer"
            echo "- **Release**: ${{ steps.tag.outputs.tag }}"
            echo "- **Installer version**: ${{ steps.tag.outputs.version }}"
            echo "- **Files attached**:"
            for f in out/*.exe; do echo "  - $(basename "$f")"; done
          } >> "$GITHUB_STEP_SUMMARY"
