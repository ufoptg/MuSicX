name: Sync Upstream Metrolist

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream-metrolist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/MetrolistGroup/Metrolist.git
      UPSTREAM_BRANCH: main
      LOCAL_BASE: main
      SYNC_BRANCH_PREFIX: chore/sync-upstream
      SYNC_LABEL: upstream-sync
      CONFLICT_LABEL: needs-manual-resolution
      # MuSicX-branded workflows — always keep ours on conflict (also in .gitattributes).
      MUSICX_WORKFLOWS: >-
        .github/workflows/build.yml
        .github/workflows/build_pr.yml
        .github/workflows/build_quick.yml
        .github/workflows/release.yml
      GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LOCAL_BASE }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity + safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          # --no-tags: we sync upstream's branch commits only. Fetching upstream
          # tags collides with the fork's own same-named release tags (e.g.
          # v13.6.2/v13.6.3) and fails with "would clobber existing tag". The
          # rest of this workflow only references upstream/$UPSTREAM_BRANCH.
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags

      - name: Compute divergence
        id: diff
        run: |
          behind=$(git rev-list --count "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH")
          ahead=$(git rev-list --count "upstream/$UPSTREAM_BRANCH..origin/$LOCAL_BASE")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead"   >> "$GITHUB_OUTPUT"
          echo "::notice::behind=$behind ahead=$ahead"

      - name: Ensure labels exist (best-effort)
        if: steps.diff.outputs.behind != '0'
        run: |
          gh label create "$SYNC_LABEL"     --color 0E8A16 --description "Automated upstream Metrolist sync"   || echo "::warning::could not create $SYNC_LABEL (check token Issues:write)"
          gh label create "$CONFLICT_LABEL"  --color D93F0B --description "Merge conflicts require human review" || echo "::warning::could not create $CONFLICT_LABEL"

      - name: Skip if an open sync PR already exists
        if: steps.diff.outputs.behind != '0'
        id: existing_pr
        run: |
          # Match by branch prefix (reliable) and label (cosmetic fallback).
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName,labels \
            --jq '[.[] | select(
              (.headRefName | startswith("'"$SYNC_BRANCH_PREFIX"'"))
              or (.labels[].name == "'"$SYNC_LABEL"'")
            ) | .number] | first // empty' 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            echo "::notice::Open sync PR #$existing already exists. Skipping."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch + attempt merge
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true'
        id: merge
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d-%H%M)
          branch="${SYNC_BRANCH_PREFIX}-${stamp}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch" "origin/$LOCAL_BASE"

          set +e
          git merge --no-ff --no-commit "upstream/$UPSTREAM_BRANCH"
          status=$?
          set -e

          auto_resolved=""
          if [[ "$status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            echo "::notice::Merge conflicts in: ${conflicts[*]}"

            for f in $MUSICX_WORKFLOWS; do
              if printf '%s\n' "${conflicts[@]}" | grep -Fxq "$f"; then
                git checkout --ours -- "$f"
                git add -- "$f"
                auto_resolved+="$f "
              fi
            done

            mapfile -t remaining < <(git diff --name-only --diff-filter=U)
            if [[ "${#remaining[@]}" -gt 0 && -n "${remaining[0]:-}" ]]; then
              echo "::error::Unresolved conflicts outside MuSicX CI workflows: ${remaining[*]}"
              echo "::error::Not committing conflict markers. Opened no sync PR — create an issue/PR manually."
              git merge --abort
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Upstream Metrolist sync blocked by conflicts" \
                --body "$(printf '%s\n' \
                  "Automated sync could not merge \`MetrolistGroup/Metrolist@${UPSTREAM_BRANCH}\` into \`${LOCAL_BASE}\`." \
                  "" \
                  "Unresolved files:" \
                  "$(printf -- '- `%s`\n' "${remaining[@]}")" \
                  "" \
                  "MuSicX CI workflows are auto-kept via \`.gitattributes\` (\`merge=ours\`). These other paths need a human merge." \
                  "" \
                  "Re-run **Sync Upstream Metrolist** after resolving, or merge upstream locally.")" \
                || echo "::warning::could not open issue"
              echo "skip_pr=true" >> "$GITHUB_OUTPUT"
              echo "clean_merge=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Auto-resolved MuSicX workflows: ${auto_resolved:-none}"
          fi

          # Take newer GitHub Action pins from upstream without adopting Metrolist branding.
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          files = [
              ".github/workflows/build.yml",
              ".github/workflows/build_pr.yml",
              ".github/workflows/build_quick.yml",
              ".github/workflows/release.yml",
          ]
          uses_re = re.compile(
              r"^(?P<pre>\s*-?\s*uses:\s+)(?P<action>[^\s@]+)@(?P<ver>v?\d+(?:\.\d+)*)(?P<post>\s*)$"
          )

          def ver_tuple(v: str):
              return tuple(int(p) for p in v.lstrip("v").split("."))

          changed = False
          for path in files:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              try:
                  upstream = subprocess.check_output(
                      ["git", "show", f"upstream/main:{path}"], text=True
                  )
              except subprocess.CalledProcessError:
                  continue

              up_ver = {}
              for line in upstream.splitlines():
                  m = uses_re.match(line)
                  if m:
                      up_ver[m.group("action")] = m.group("ver")

              ours = p.read_text()
              out_lines = []
              file_changed = False
              for line in ours.splitlines():
                  m = uses_re.match(line)
                  if m and m.group("action") in up_ver:
                      cur, nxt = m.group("ver"), up_ver[m.group("action")]
                      try:
                          if ver_tuple(nxt) > ver_tuple(cur):
                              line = f"{m.group('pre')}{m.group('action')}@{nxt}{m.group('post')}"
                              file_changed = True
                      except ValueError:
                          pass
                  out_lines.append(line)

              if file_changed:
                  text = "\n".join(out_lines)
                  if ours.endswith("\n"):
                      text += "\n"
                  p.write_text(text)
                  changed = True
                  print(f"bumped action pins in {path}")

          PY
          git add -- $MUSICX_WORKFLOWS

          if git grep -n -E '^<<<<<<< |^>>>>>>> ' -- .; then
            echo "::error::Conflict markers still present after resolution; aborting."
            git merge --abort || true
            exit 1
          fi

          # Upstream-only edits to MuSicX-kept workflows yield an empty tree; still
          # record the merge so the next sync is not perpetually "behind".
          if [[ -f .git/MERGE_HEAD ]]; then
            if git diff --cached --quiet && git diff --quiet; then
              git commit --no-verify --allow-empty \
                -m "chore: sync upstream MetrolistGroup/Metrolist@main" \
                -m "No tree changes (MuSicX CI workflows kept via merge=ours)."
            else
              git commit --no-verify -m "chore: sync upstream MetrolistGroup/Metrolist@main"
            fi
          else
            echo "::error::Merge state missing; refusing to commit."
            exit 1
          fi

          echo "skip_pr=false" >> "$GITHUB_OUTPUT"
          echo "clean_merge=true" >> "$GITHUB_OUTPUT"
          if [[ -n "${auto_resolved}" ]]; then
            echo "auto_resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true'
        run: |
          {
            echo "## What"
            echo "Auto-generated PR to bring \`ufoptg/MuSicX\` up to date with upstream \`MetrolistGroup/Metrolist@${UPSTREAM_BRANCH}\`."
            echo ""
            echo "- Behind by: ${{ steps.diff.outputs.behind }} commit(s)"
            echo "- Clean merge: ${{ steps.merge.outputs.clean_merge }}"
            echo "- MuSicX workflows auto-kept: ${{ steps.merge.outputs.auto_resolved }}"
            echo ""
            echo "## Upstream commits"
            git log --oneline --no-decorate "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH" | sed 's/^/- /'
            echo ""
            echo "## Changed files (truncated)"
            echo '```'
            git diff --stat --no-color "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH" | tail -n 40
            echo '```'
            echo ""
            echo "## Notes"
            echo "- MuSicX CI workflows (\`build\`, \`build_pr\`, \`build_quick\`, \`release\`) are kept via \`merge=ours\` + action-pin bumps from upstream."
            echo "- MuSicX branding, application IDs, artifact names, and \`submodules: recursive\` are preserved."
            echo ""
            echo "## Reviewer checklist"
            echo "- [ ] Verify no MuSicX features regressed"
            echo "- [ ] Check CI builds"
          } > pr_body.md

      - name: Push sync branch
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true'
        run: git push origin "${{ steps.merge.outputs.branch }}"

      - name: Open Pull Request
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true'
        id: pr
        run: |
          url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$LOCAL_BASE" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: sync upstream Metrolist" \
            --body-file pr_body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Opened PR: $url"

          gh pr edit "$url" --add-label "$SYNC_LABEL" || echo "::warning::could not add $SYNC_LABEL"

      - name: Enable auto-merge
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true' && steps.merge.outputs.clean_merge == 'true'
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --auto
          echo "::notice::Squash auto-merge enabled - will land on main once required checks pass."
