name: Sync Upstream Metrolist

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write            # <-- labels use the Issues API (fixes GITHUB_TOKEN fallback)

concurrency:
  group: sync-upstream-metrolist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/MetrolistGroup/Metrolist.git
      UPSTREAM_BRANCH: main
      LOCAL_BASE: main
      SYNC_BRANCH_PREFIX: chore/sync-upstream
      SYNC_LABEL: upstream-sync
      CONFLICT_LABEL: needs-manual-resolution
      GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LOCAL_BASE }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity + safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --tags

      - name: Compute divergence
        id: diff
        run: |
          behind=$(git rev-list --count "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH")
          ahead=$(git rev-list --count "upstream/$UPSTREAM_BRANCH..origin/$LOCAL_BASE")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead"   >> "$GITHUB_OUTPUT"
          echo "::notice::behind=$behind ahead=$ahead"

      - name: Ensure labels exist (best-effort)
        if: steps.diff.outputs.behind != '0'
        run: |
          gh label create "$SYNC_LABEL"     --color 0E8A16 --description "Automated upstream Metrolist sync"   || echo "::warning::could not create $SYNC_LABEL (check token Issues:write)"
          gh label create "$CONFLICT_LABEL"  --color D93F0B --description "Merge conflicts require human review" || echo "::warning::could not create $CONFLICT_LABEL"

      - name: Skip if an open sync PR already exists
        if: steps.diff.outputs.behind != '0'
        id: existing_pr
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "$SYNC_LABEL" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            echo "::notice::Open sync PR #$existing already exists. Skipping."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch + attempt merge
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true'
        id: merge
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          branch="${SYNC_BRANCH_PREFIX}-${stamp}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch" "origin/$LOCAL_BASE"

          set +e
          git merge --no-ff "upstream/$UPSTREAM_BRANCH" \
            -m "chore: sync upstream MetrolistGroup/Metrolist@main"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "clean_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean_merge=false" >> "$GITHUB_OUTPUT"
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git add -A
            git commit --no-verify \
              -m "chore: sync upstream MetrolistGroup/Metrolist@main (CONFLICTS)" \
              -m "Files requiring manual resolution: $conflicts"
          fi

      - name: Build PR body
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true'
        run: |
          {
            echo "## What"
            echo "Auto-generated PR to bring \`ufoptg/MuSicX\` up to date with upstream \`MetrolistGroup/Metrolist@${UPSTREAM_BRANCH}\`."
            echo ""
            echo "- Behind by: ${{ steps.diff.outputs.behind }} commit(s)"
            echo "- Clean merge: ${{ steps.merge.outputs.clean_merge }}"
            echo ""
            echo "## Upstream commits"
            git log --oneline --no-decorate "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH" | sed 's/^/- /'
            echo ""
            echo "## Changed files (truncated)"
            echo '```'
            git diff --stat --no-color "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH" | tail -n 40
            echo '```'
            echo ""
            echo "## Reviewer checklist"
            echo "- [ ] Verify no MuSicX features regressed"
            echo "- [ ] Check CI builds"
          } > pr_body.md

      - name: Push sync branch
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true'
        run: git push origin "${{ steps.merge.outputs.branch }}"

      - name: Open Pull Request
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true'
        id: pr
        run: |
          # Create the PR WITHOUT labels so a missing label can never fail this step.
          url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$LOCAL_BASE" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: sync upstream Metrolist" \
            --body-file pr_body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Opened PR: $url"

          # Labels are cosmetic now — attach best-effort, never fail the job.
          gh pr edit "$url" --add-label "$SYNC_LABEL" || echo "::warning::could not add $SYNC_LABEL"
          if [[ "${{ steps.merge.outputs.clean_merge }}" != "true" ]]; then
            gh pr edit "$url" --add-label "$CONFLICT_LABEL" || echo "::warning::could not add $CONFLICT_LABEL"
          fi

      - name: Enable auto-merge (clean syncs only)
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.clean_merge == 'true'
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --auto
          echo "::notice::Squash auto-merge enabled - will land on main once required checks pass."

      - name: Conflict notice
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.clean_merge == 'false'
        run: |
          echo "::warning::Merge had conflicts. PR opened with the needs-manual-resolution label - resolve it manually."
