name: Sync Upstream (MuSicX)

# Applies MuSicXGroup/MuSicX changes as *remapped* patches: an upstream diff is
# transformed by scripts/rebrand/remap.py (com.metrolist.* -> dev.musicx.*, MuSicX ->
# MuSicX, musicx_strings.xml -> musicx_strings.xml) and then applied with git apply
# --3way. The last successfully synced upstream SHA lives in .github/sync/upstream-head.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream-musicx
  cancel-in-progress: false

env:
  HEAD_FILE: .github/sync/upstream-head
  # MuSicX-branded workflows — always keep ours (also in .gitattributes).
  MUSICX_WORKFLOWS: >-
    .github/workflows/build.yml
    .github/workflows/build_pr.yml
    .github/workflows/build_quick.yml
    .github/workflows/release.yml
  GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/MuSicXGroup/MuSicX.git
      UPSTREAM_BRANCH: main
      LOCAL_BASE: main
      SYNC_BRANCH_PREFIX: chore/sync-upstream
      SYNC_LABEL: upstream-sync
      CONFLICT_LABEL: needs-manual-resolution
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.LOCAL_BASE }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity + safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags

      - name: Compute divergence
        id: diff
        run: |
          behind=$(git rev-list --count "origin/$LOCAL_BASE..upstream/$UPSTREAM_BRANCH")
          ahead=$(git rev-list --count "upstream/$UPSTREAM_BRANCH..origin/$LOCAL_BASE")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead"   >> "$GITHUB_OUTPUT"
          echo "::notice::behind=$behind ahead=$ahead"

      - name: Resolve last synced upstream SHA
        id: last
        run: |
          last=$(git show "origin/$LOCAL_BASE:$HEAD_FILE" 2>/dev/null || echo "")
          if [[ -z "$last" ]] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
            last=$(git merge-base "origin/$LOCAL_BASE" "upstream/$UPSTREAM_BRANCH")
            echo "::notice::No stored upstream head; using merge-base $last"
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist (best-effort)
        if: steps.diff.outputs.behind != '0'
        run: |
          gh label create "$SYNC_LABEL"     --color 0E8A16 --description "Automated upstream MuSicX sync"   || echo "::warning::could not create $SYNC_LABEL (check token Issues:write)"
          gh label create "$CONFLICT_LABEL"  --color D93A0B --description "Merge conflicts require human review" || echo "::warning::could not create $CONFLICT_LABEL"

      - name: Skip if an open sync PR already exists
        if: steps.diff.outputs.behind != '0'
        id: existing_pr
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName,labels \
            --jq '[.[] | select(
            (.headRefName | startswith("'"$SYNC_BRANCH_PREFIX"'"))
            or (.labels[].name == "'"$SYNC_LABEL"'")
          ) | .number] | first // empty' 2>/dev/null || true)
          if [[ -n "$existing" ]]; then
            echo "::notice::Open sync PR #$existing already exists. Skipping."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch + apply remapped upstream patch
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true'
        id: merge
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d-%H%M)
          branch="${SYNC_BRANCH_PREFIX}-${stamp}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch" "origin/$LOCAL_BASE"

          last="${{ steps.last.outputs.last }}"

          # Our own copies of MuSicX CI workflows (and the sync bookkeeping) are never taken
          # from upstream.
          git diff --binary "$last..upstream/$UPSTREAM_BRANCH" \
            --exclude='.github/workflows/build.yml' \
            --exclude='.github/workflows/build_pr.yml' \
            --exclude='.github/workflows/build_quick.yml' \
            --exclude='.github/workflows/release.yml' \
            --exclude='.github/workflows/build_windows.yml' \
            --exclude='.github/workflows/sync-upstream*.yml' \
            --exclude='.github/sync/*' \
            --exclude='README.md' \
            --exclude='docs/*' \
            > upstream.patch

          python3 scripts/rebrand/remap.py patch < upstream.patch > upstream.remap.patch

          set +e
          git apply --3way --whitespace=nowarn upstream.remap.patch
          apply_status=$?
          set -e
          if [[ "$apply_status" -ne 0 ]]; then
            echo "::error::Remapped upstream patch failed to apply cleanly."
            git reset --hard >/dev/null
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Upstream MuSicX sync blocked (remapped patch)" \
              --body "$(printf '%s\n' \
                "Automated sync could not apply the remapped upstream patch for" \
                "\`MuSicXGroup/MuSicX@${UPSTREAM_BRANCH}\` into \`${LOCAL_BASE}\`." \
                "" \
                "Retry manually: generate \`git diff --binary ${last}..upstream/${UPSTREAM_BRANCH}\`,` \
                "pipe it through \`python3 scripts/rebrand/remap.py patch\`, then \`git apply --3way\`." \
                "" \
                "Re-run **Sync Upstream (MuSicX)** after resolving.")" \
              || echo "::warning::could not open issue"
            echo "skip_pr=true"  >> "$GITHUB_OUTPUT"
            echo "clean_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Take newer GitHub Action pins from upstream into our kept workflows.
          python3 - <<'PY'
          import pathlib, re, subprocess

          files = [
              ".github/workflows/build.yml",
              ".github/workflows/build_pr.yml",
              ".github/workflows/build_quick.yml",
              ".github/workflows/release.yml",
          ]
          uses_re = re.compile(
              r"^(?P<pre>\s*-?\s*uses:\s+)(?P<action>[^\s@]+)@(?P<ver>v?\d+(?:\.\d+)*)(?P<post>\s*)$"
          )

          def ver_tuple(v):
              return tuple(int(p) for p in v.lstrip("v").split("."))

          changed = False
          for path in files:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              try:
                  upstream = subprocess.check_output(
                      ["git", "show", f"upstream/main:{path}"], text=True
                  )
              except subprocess.CalledProcessError:
                  continue

              up_ver = {}
              for line in upstream.splitlines():
                  m = uses_re.match(line)
                  if m:
                      up_ver[m.group("action")] = m.group("ver")

              ours = p.read_text()
              out_lines = []
              file_changed = False
              for line in ours.splitlines():
                  m = uses_re.match(line)
                  if m and m.group("action") in up_ver:
                      cur, nxt = m.group("ver"), up_ver[m.group("action")]
                      try:
                          if ver_tuple(nxt) > ver_tuple(cur):
                              line = f"{m.group('pre')}{m.group('action')}@{nxt}{m.group('post')}"
                              file_changed = True
                      except ValueError:
                          pass
                  out_lines.append(line)

              if file_changed:
                  text = "\n".join(out_lines)
                  if ours.endswith("\n"):
                      text += "\n"
                  p.write_text(text)
                  changed = True
                  print(f"bumped action pins in {path}")
          PY

          if git grep -n -E '^<<<<<<< |^>>>>>>> ' -- . > /dev/null; then
            echo "::error::Conflict markers still present after resolution; aborting."
            git reset --hard >/dev/null
            exit 1
          fi

          git rev-parse "upstream/$UPSTREAM_BRANCH" > "$HEAD_FILE"
          git add -- "$HEAD_FILE" $MUSICX_WORKFLOWS

          git commit --no-verify -m "chore: sync upstream MuSicXGroup/MuSicX@${UPSTREAM_BRANCH}" -m "Remapped to the MuSicX namespace (dev.musicx.*)."

          echo "skip_pr=false"   >> "$GITHUB_OUTPUT"
          echo "clean_merge=true" >> "$GITHUB_OUTPUT"
          echo "auto_resolved=true" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true'
        run: |
          {
            echo "## What"
            echo "Auto-generated PR to bring \`MuSicXGroup/MuSicX\` up to date with upstream \`MuSicXGroup/MuSicX@${UPSTREAM_BRANCH}\` (remapped to the MuSicX namespace)."
            echo ""
            echo "- Behind by: ${{ steps.diff.outputs.behind }} commit(s)"
            echo ""
            echo "## Upstream commits"
            git log --oneline --no-decorate "${{ steps.last.outputs.last }}..upstream/$UPSTREAM_BRANCH" | sed 's/^/- /'
            echo ""
            echo "## Changed files (truncated)"
            echo '```'
            git diff --stat --no-color "${{ steps.last.outputs.last }}..upstream/$UPSTREAM_BRANCH" | tail -n 40
            echo '```'
            echo ""
            echo "## Notes"
            echo "- Upstream changes are remapped: \`com.metrolist.*\` -> \`dev.musicx.*\`, \`MuSicX\` -> \`MuSicX\`, \`musicx_strings.xml\` -> \`musicx_strings.xml\` (scripts/rebrand/remap.py)."
            echo "- MuSicX CI workflows are ours and are excluded from the upstream diff."
            echo ""
            echo "## Reviewer checklist"
            echo "- [ ] Verify the remap behaved as expected"
            echo "- [ ] Check CI builds"
          } > pr_body.md

      - name: Push sync branch
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true'
        run: git push origin "${{ steps.merge.outputs.branch }}"

      - name: Open Pull Request
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true'
        id: pr
        run: |
          url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$LOCAL_BASE" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore: sync upstream MuSicX (remapped to MuSicX)" \
            --body-file pr_body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Opened PR: $url"

          gh pr edit "$url" --add-label "$SYNC_LABEL" || echo "::warning::could not add $SYNC_LABEL"

      - name: Enable auto-merge
        if: steps.diff.outputs.behind != '0' && steps.existing_pr.outputs.skip != 'true' && steps.merge.outputs.skip_pr != 'true' && steps.merge.outputs.clean_merge == 'true'
        run: |
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --auto
          echo "::notice::Squash auto-merge enabled - will land once required checks pass."
